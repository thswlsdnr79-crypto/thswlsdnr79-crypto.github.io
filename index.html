<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
:root{
  --bg:#ffffff; --fg:#1c1c1e; --muted:#6b6b70; --line:#e5e5ea;
  --card:#fafafa; --accent:#0a84ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --fg:#ececf1; --muted:#9a9aa2; --line:#2c2c30;
    --card:#1a1a1d; --accent:#4da3ff;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
              "Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  line-height:1.75; font-size:16px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px; margin:0 auto; padding:48px 20px 96px}
h1{font-size:1.7rem; line-height:1.3; margin:0 0 6px; letter-spacing:-0.02em}
h2{font-size:1.15rem; margin:44px 0 12px; padding-top:22px;
   border-top:1px solid var(--line); letter-spacing:-0.01em}
h2:first-of-type{border-top:0; padding-top:0; margin-top:32px}
h3{font-size:1rem; margin:26px 0 4px}
.tag{color:var(--muted); font-size:1.02rem; margin:0 0 4px}
.meta{color:var(--muted); font-size:.875rem; margin:0 0 8px}
.meta a{color:var(--muted)}
hr{border:0; border-top:1px solid var(--line); margin:32px 0}
ol{padding-left:1.35em; margin:0}
li{margin:12px 0}
p{margin:16px 0}
strong{font-weight:600}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.lead{background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:16px 18px; margin:20px 0}
.lead p{margin:0}
.back{display:inline-block; margin-bottom:28px; font-size:.9rem; color:var(--muted)}
.applist{list-style:none; padding:0; margin:28px 0 0}
.applist li{margin:0 0 12px}
.applist a{display:block; padding:18px 20px; border:1px solid var(--line);
           border-radius:12px; background:var(--card); color:inherit}
.applist a:hover{border-color:var(--accent); text-decoration:none}
.applist .name{font-weight:600; font-size:1.05rem}
.applist .desc{color:var(--muted); font-size:.9rem; margin-top:2px}
.feat{list-style:none; padding:0; margin:20px 0 0}
.feat li{border:1px solid var(--line); border-radius:12px; background:var(--card);
         padding:16px 18px; margin:0 0 10px}
.feat .t{font-weight:600; display:block; margin-bottom:2px}
.feat .d{color:var(--muted); font-size:.94rem}
.langs{display:flex; flex-wrap:wrap; gap:8px; margin:24px 0 8px}
.langs a{display:inline-block; padding:6px 12px; border:1px solid var(--line);
         border-radius:999px; background:var(--card); color:var(--muted);
         font-size:.85rem; white-space:nowrap}
.langs a:hover{border-color:var(--accent); color:var(--accent); text-decoration:none}
h2{scroll-margin-top:16px}
.btnrow{margin:26px 0 0}
.btnrow a{display:inline-block; padding:11px 20px; border:1px solid var(--line);
          border-radius:10px; background:var(--card); margin:0 8px 8px 0; color:inherit}
.btnrow a:hover{border-color:var(--accent); color:var(--accent); text-decoration:none}
footer{margin-top:64px; padding-top:24px; border-top:1px solid var(--line);
       color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<h1>Apps</h1>
<p class="tag">개인이 만든 iOS 앱들입니다. / Independent iOS apps.</p>
<ul class="applist">
  <li><a href="moodmeleon/"><div class="name">MoodMeleon</div><div class="desc">하루의 감정을 색으로 남기는 기록장</div></a></li>
  <li><a href="turtletiles/"><div class="name">TurtleTiles</div><div class="desc">내 사진으로 만드는 슬라이드·직소 퍼즐</div></a></li>
  <li><a href="snailway/"><div class="name">Snailway</div><div class="desc">걸은 길이 그림이 되는 산책 기록</div></a></li>
  <li><a href="octopick/"><div class="name">OctoPick</div><div class="desc">뽑기·순서·팀 나누기 도구</div></a></li>
</ul>
<h2>문의 / Contact</h2>
<p><a href="mailto:supersons.apps@gmail.com">supersons.apps@gmail.com</a></p>
<footer>
  문의 / Contact: <a href="mailto:supersons.apps@gmail.com">supersons.apps@gmail.com</a>
</footer>
</div>
</body>
</html>
